# Exact-Git opt-in R0 candidate. Curated discovery does not grant provider or
# feature authority; Vqro must still admit it through the coordinated host gate.
manifest_version = 2
package_contract = "vqro.package.v1"
id = "vqro.collections"
version = "1.0.0"
min_vqro_version = "0.9.0"
namespaces = ["vqro.collections"]

[[services]]
id = "collections"
provides = ["host_document"]
capabilities = ["host.state.read", "host.terminals.read"]

[services.runtime]
kind = "component"
component = "services/collections.wasm"
world = "vqro:extension/service@1.0.0"
